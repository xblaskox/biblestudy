<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Order — A Chronological Bible Study</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper: #eadfc4;
    --paper-2: #e2d5b2;
    --ink: #2b2416;
    --ink-soft: #5c5238;
    --rule: #c9b98c;
    --quote: #2c4a6e;
    --quote-bg: #dbe4ee;
    --prophecy: #8a5a12;
    --prophecy-bg: #f0e0bd;
    --accent: #7a3b28;
    --panel: #f2ead4;
    --shadow: rgba(43,36,22,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #f1e6c8, var(--paper) 55%);
    color:var(--ink);
    font-family:'Crimson Pro', serif;
    min-height:100vh;
  }
  ::selection{ background: var(--prophecy-bg); }

  a{color:inherit;}

  /* ---------- Layout shell ---------- */
  .app{
    display:grid;
    grid-template-columns: 250px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "topbar topbar"
      "nav main";
    min-height:100vh;
  }
  @media (max-width: 820px){
    .app{ grid-template-columns: 1fr; grid-template-areas: "topbar" "nav" "main"; }
    .nav{ max-height: 260px; }
  }

  /* ---------- Top bar ---------- */
  .topbar{
    grid-area: topbar;
    background: linear-gradient(180deg, #3a2c1c, #2b2115);
    color: #ecdfba;
    padding: 14px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border-bottom: 3px double #6d5a34;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:700; font-size:1.5rem; letter-spacing:.03em; margin:0;
  }
  .brand span{ font-size:.72rem; color:#c7b384; letter-spacing:.12em; text-transform:uppercase; }

  .era-readout{
    font-family:'IBM Plex Mono', monospace;
    font-size:.78rem;
    color:#f0dfa8;
    background:rgba(0,0,0,.25);
    border:1px solid #6d5a34;
    padding:6px 12px;
    border-radius:3px;
    min-width:210px;
    text-align:center;
  }

  .order-toggle{
    display:flex; background:rgba(0,0,0,.25); border:1px solid #6d5a34; border-radius:20px; overflow:hidden;
  }
  .order-toggle button{
    font-family:'IBM Plex Mono', monospace; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    padding:7px 14px; background:transparent; border:none; color:#c7b384; cursor:pointer;
  }
  .order-toggle button.active{ background:#c98a3d; color:#2b2115; font-weight:600; }

  /* ---------- Sidebar / timeline nav ---------- */
  .nav{
    grid-area: nav;
    background: var(--panel);
    border-right: 1px solid var(--rule);
    overflow-y:auto;
    padding: 6px 0 30px;
    position:relative;
  }
  .nav-section-title{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); padding: 14px 18px 6px;
  }
  .spine{
    position:relative;
    padding-left: 26px;
  }
  .spine::before{
    content:"";
    position:absolute; left:12px; top:0; bottom:0; width:2px;
    background: repeating-linear-gradient(180deg, var(--accent) 0 6px, transparent 6px 11px);
  }
  .nav-item{
    position:relative;
    display:block;
    padding: 8px 14px 8px 6px;
    margin: 2px 8px 2px 0;
    cursor:pointer;
    border-radius: 0 4px 4px 0;
    font-size:.92rem;
    color:var(--ink);
  }
  .nav-item::before{
    content:"";
    position:absolute; left:-20px; top:50%; transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%;
    background: var(--paper); border:2px solid var(--accent);
  }
  .nav-item.read::before{ background: var(--accent); }
  .nav-item.active{ background: var(--paper-2); font-weight:600; }
  .nav-item.active::before{ box-shadow: 0 0 0 3px rgba(122,59,40,.2); }
  .nav-item .chk{ float:right; font-size:.72rem; color: var(--ink-soft); }
  .nav-item.read .chk{ color: var(--accent); }
  .nav-note-item{
    position:relative;
    margin: 6px 8px 6px 0; padding: 8px 10px 8px 6px;
    font-size:.82rem; font-style:italic; color:var(--ink-soft);
    border-left: 2px solid var(--prophecy);
  }
  .nav-note-item::before{
    content:"✦";
    position:absolute; left:-24px; top:8px; color:var(--prophecy); font-size:.7rem;
  }
  .book-group summary{
    padding: 8px 16px; cursor:pointer; font-family:'Cormorant Garamond', serif; font-weight:700;
    font-size:1.02rem; color:var(--accent); list-style:none;
  }
  .book-group summary::-webkit-details-marker{ display:none; }
  .book-group summary::before{ content:"› "; }
  .book-group[open] summary::before{ content:"⌄ "; }

  /* ---------- Main reading pane ---------- */
  .main{
    grid-area: main;
    padding: 30px 40px 80px;
    max-width: 760px;
    margin: 0 auto;
  }
  .chapter-head{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
    border-bottom: 2px solid var(--rule); padding-bottom:10px; margin-bottom: 18px;
  }
  .chapter-head h2{
    font-family:'Cormorant Garamond', serif; font-size:2.1rem; font-weight:700; margin:0;
  }
  .chapter-head .amtag{
    font-family:'IBM Plex Mono', monospace; font-size:.75rem; color:var(--ink-soft);
    background: var(--paper-2); border:1px solid var(--rule); padding:4px 10px; border-radius:3px;
  }
  .verse{
    margin: 0 0 2px;
    line-height:1.85;
    font-size:1.12rem;
  }
  .vnum{
    font-family:'IBM Plex Mono', monospace; font-size:.68rem; color:var(--ink-soft);
    vertical-align: super; margin-right:4px;
  }
  .tag{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:.62rem; font-weight:600;
    padding:0 5px; border-radius:8px; margin-left:4px; cursor:pointer; text-decoration:none;
    position:relative; top:-1px;
  }
  .tag.quote{ background:var(--quote-bg); color:var(--quote); border:1px solid var(--quote); }
  .tag.prophecy{ background:var(--prophecy-bg); color:var(--prophecy); border:1px solid var(--prophecy); }

  .chapter-actions{
    margin-top: 26px; padding-top: 16px; border-top:1px dashed var(--rule);
    display:flex; align-items:center; gap:14px;
  }
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:.78rem; letter-spacing:.04em;
    background: var(--accent); color:#f2ead4; border:none; padding:9px 16px; border-radius:3px; cursor:pointer;
  }
  .btn.secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .chrono-note-card{
    background: var(--panel); border:1px solid var(--prophecy); border-left:5px solid var(--prophecy);
    padding: 18px 20px; border-radius: 4px; margin: 26px 0;
  }
  .chrono-note-card h3{ margin:0 0 6px; font-family:'Cormorant Garamond',serif; color:var(--prophecy); font-size:1.3rem; }
  .chrono-note-card p{ margin:0 0 8px; color: var(--ink-soft); font-size:.95rem; }

  .placeholder-card{
    text-align:center; padding: 40px 20px; color:var(--ink-soft); font-style:italic;
    border: 1px dashed var(--rule); border-radius:6px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,15,8,.55); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--panel); max-width:460px; width:100%; border-radius:8px;
    box-shadow: 0 18px 50px var(--shadow); padding: 22px 24px; border-top:5px solid var(--quote);
  }
  .modal.prophecy{ border-top-color: var(--prophecy); }
  .modal .kicker{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
  .modal h3{ font-family:'Cormorant Garamond',serif; margin:4px 0 12px; font-size:1.4rem; }
  .modal blockquote{ margin:0 0 12px; padding-left:14px; border-left:3px solid var(--rule); font-style:italic; color:var(--ink-soft); }
  .modal .modal-note{ font-size:.88rem; color:var(--ink-soft); margin-bottom:14px; }
  .modal-close{ float:right; background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--ink-soft); }

  .progress-strip{
    padding: 10px 18px; font-family:'IBM Plex Mono', monospace; font-size:.72rem; color:var(--ink-soft);
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); background:var(--paper-2);
  }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>In Order</h1>
      <span>A Chronological Bible Study Companion</span>
    </div>
    <div class="era-readout" id="eraReadout">Genesis 1 · AM 1 · Day 1–6 of Creation</div>
    <div class="order-toggle">
      <button id="btnCanonical" class="active">Canonical</button>
      <button id="btnChrono">Chronological</button>
    </div>
  </div>

  <div class="nav" id="nav"></div>

  <div class="main" id="main"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕ close</button>
    <div class="kicker" id="modalKicker">Cross-reference</div>
    <h3 id="modalTitle"></h3>
    <blockquote id="modalQuote"></blockquote>
    <div class="modal-note" id="modalNote"></div>
  </div>
</div>

/* ========================= state & storage ========================= */

let order = "canonical"; // or "chrono"
let currentKey = "genesis:1";
let readSet = new Set();

async function loadProgress(){
  try{
    const r = await window.storage.get("reading-progress", false);
    if(r && r.value){
      const arr = JSON.parse(r.value);
      readSet = new Set(arr);
    }
  }catch(e){ /* first run — nothing saved yet */ }
}
async function saveProgress(){
  try{
    await window.storage.set("reading-progress", JSON.stringify([...readSet]), false);
  }catch(e){ console.error("Could not save progress", e); }
}
function chapterKey(book,chapter){ return book+":"+chapter; }

/* ============================ rendering ============================= */

function crossRefsFor(book,chapter,verse){
  return CROSS_REFS.filter(c => c.ref.b===book && c.ref.c===chapter && c.ref.v===verse);
}
function propheciesFor(book,chapter,verse){
  return PROPHECIES.filter(p => p.ref.b===book && p.ref.c===chapter && p.ref.v===verse);
}

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";

  if(order === "canonical"){
    const title = document.createElement("div");
    title.className = "nav-section-title";
    title.textContent = "66 Books · Canonical Order";
    nav.appendChild(title);

    BOOK_ORDER.forEach(bookId=>{
      const book = BIBLE[bookId];
      const details = document.createElement("details");
      details.className = "book-group";
      details.open = true;
      const summary = document.createElement("summary");
      summary.textContent = book.name;
      details.appendChild(summary);
      const spine = document.createElement("div");
      spine.className = "spine";
      Object.keys(book.chapters).forEach(chNum=>{
        spine.appendChild(navItem(bookId, Number(chNum)));
      });
      details.appendChild(spine);
      nav.appendChild(details);
    });

    const more = document.createElement("div");
    more.className = "nav-section-title";
    more.style.opacity = ".6";
    more.textContent = "Exodus → Revelation — coming in later passes";
    nav.appendChild(more);

  } else {
    const title = document.createElement("div");
    title.className = "nav-section-title";
    title.textContent = "Biblical Chronological Order";
    nav.appendChild(title);
    const spine = document.createElement("div");
    spine.className = "spine";
    CHRONO_SEQUENCE.forEach(item=>{
      if(item.type === "chapter"){
        spine.appendChild(navItem(item.book, item.chapter));
      } else if(item.type === "note"){
        const el = document.createElement("div");
        el.className = "nav-note-item";
        el.textContent = item.title;
        spine.appendChild(el);
      } else if(item.type === "placeholder"){
        const el = document.createElement("div");
        el.className = "nav-note-item";
        el.textContent = "More books ahead...";
        spine.appendChild(el);
      }
    });
    nav.appendChild(spine);
  }
}

function navItem(bookId, chNum){
  const key = chapterKey(bookId, chNum);
  const div = document.createElement("div");
  div.className = "nav-item" + (readSet.has(key) ? " read" : "") + (key===currentKey ? " active":"");
  div.innerHTML = BIBLE[bookId].name + " " + chNum + '<span class="chk">' + (readSet.has(key) ? "✓ read" : "") + "</span>";
  div.addEventListener("click", ()=>{ currentKey = key; renderAll(); window.scrollTo({top:0, behavior:"smooth"}); });
  return div;
}

function renderMain(){
  const main = document.getElementById("main");
  main.innerHTML = "";

  // If in chrono mode, we may be sitting on a "note" or "placeholder" — but
  // currentKey always points at a real chapter; notes are shown inline
  // between chapters in the reading flow when relevant.
  const [bookId, chNumStr] = currentKey.split(":");
  const chNum = Number(chNumStr);
  const book = BIBLE[bookId];
  const chapter = book.chapters[chNum];

  const head = document.createElement("div");
  head.className = "chapter-head";
  head.innerHTML = `<h2>${book.name} ${chNum}</h2><span class="amtag">${chapter.am}</span>`;
  main.appendChild(head);

  chapter.verses.forEach(([vnum, text])=>{
    const p = document.createElement("p");
    p.className = "verse";
    let html = `<span class="vnum">${vnum}</span> ${text}`;
    crossRefsFor(bookId, chNum, vnum).forEach(cr=>{
      html += ` <a class="tag quote" data-kind="quote" data-b="${bookId}" data-c="${chNum}" data-v="${vnum}">quote ↗</a>`;
    });
    propheciesFor(bookId, chNum, vnum).forEach(pr=>{
      html += ` <a class="tag prophecy" data-kind="prophecy" data-b="${bookId}" data-c="${chNum}" data-v="${vnum}">prophecy ↗</a>`;
    });
    p.innerHTML = html;
    main.appendChild(p);
  });

  // If chronological order and this chapter is Genesis 10, show the Job note
  // right after it, before Genesis 11.
  if(order === "chrono" && bookId==="genesis" && chNum===10){
    main.appendChild(buildNoteCard(CHRONO_SEQUENCE.find(i=>i.type==="note")));
  }
  if(order === "chrono" && bookId==="genesis" && chNum===11){
    main.appendChild(buildPlaceholderCard(CHRONO_SEQUENCE.find(i=>i.type==="placeholder")));
  }

  const actions = document.createElement("div");
  actions.className = "chapter-actions";
  const key = chapterKey(bookId, chNum);
  const isRead = readSet.has(key);
  actions.innerHTML = `
    <button class="btn" id="markReadBtn">${isRead ? "Marked as read ✓" : "Mark chapter as read"}</button>
    <button class="btn secondary" id="prevBtn">◂ Previous</button>
    <button class="btn secondary" id="nextBtn">Next ▸</button>
  `;
  main.appendChild(actions);

  document.getElementById("markReadBtn").addEventListener("click", ()=>{
    if(readSet.has(key)) readSet.delete(key); else readSet.add(key);
    saveProgress();
    renderAll();
  });
  document.getElementById("prevBtn").addEventListener("click", ()=> step(-1));
  document.getElementById("nextBtn").addEventListener("click", ()=> step(1));

  main.querySelectorAll(".tag").forEach(t=>{
    t.addEventListener("click", (e)=>{
      const {kind,b,c,v} = e.target.dataset;
      openModal(kind, b, Number(c), Number(v));
    });
  });

  document.getElementById("eraReadout").textContent = `${book.name} ${chNum} · ${chapter.am}`;
}

function buildNoteCard(note){
  const div = document.createElement("div");
  div.className = "chrono-note-card";
  div.innerHTML = `<h3>✦ ${note.title}</h3><p>${note.body}</p>
    <button class="btn secondary" disabled>Switch to Job — coming soon</button>`;
  return div;
}
function buildPlaceholderCard(ph){
  const div = document.createElement("div");
  div.className = "placeholder-card";
  div.textContent = ph.body;
  return div;
}

function step(dir){
  const flat = [];
  BOOK_ORDER.forEach(b=> Object.keys(BIBLE[b].chapters).forEach(c=> flat.push(chapterKey(b, Number(c)))));
  const idx = flat.indexOf(currentKey);
  const next = idx + dir;
  if(next >= 0 && next < flat.length){ currentKey = flat[next]; renderAll(); window.scrollTo({top:0, behavior:"smooth"}); }
}

function openModal(kind, b, c, v){
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  const kicker = document.getElementById("modalKicker");
  const title = document.getElementById("modalTitle");
  const quote = document.getElementById("modalQuote");
  const note = document.getElementById("modalNote");

  if(kind === "quote"){
    const cr = crossRefsFor(b,c,v)[0];
    modal.className = "modal";
    kicker.textContent = "Quoted elsewhere";
    title.textContent = cr.target;
    quote.textContent = cr.text;
    note.textContent = cr.label;
  } else {
    const pr = propheciesFor(b,c,v)[0];
    modal.className = "modal prophecy";
    kicker.textContent = "Prophecy fulfilled";
    title.textContent = pr.fulfilledRef;
    quote.textContent = pr.fulfilledText || "(Full text not yet loaded in this starter build.)";
    note.textContent = pr.note;
  }
  overlay.classList.add("open");
}

document.getElementById("modalClose").addEventListener("click", ()=> document.getElementById("overlay").classList.remove("open"));
document.getElementById("overlay").addEventListener("click", (e)=>{ if(e.target.id==="overlay") document.getElementById("overlay").classList.remove("open"); });

document.getElementById("btnCanonical").addEventListener("click", ()=>{
  order = "canonical";
  document.getElementById("btnCanonical").classList.add("active");
  document.getElementById("btnChrono").classList.remove("active");
  renderAll();
});
document.getElementById("btnChrono").addEventListener("click", ()=>{
  order = "chrono";
  document.getElementById("btnChrono").classList.add("active");
  document.getElementById("btnCanonical").classList.remove("active");
  renderAll();
});

function renderAll(){
  renderNav();
  renderMain();
}

(async function init(){
  await loadProgress();
  renderAll();
})();
</script>
</body>
</html>
